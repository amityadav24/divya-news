<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage News - Divya News Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e5e7eb;
        }

        .header h1 {
            color: #1E3A8A;
            font-size: 2rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1E3A8A, #DC143C);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.4);
        }

        .btn-danger {
            background: #DC143C;
            color: white;
        }

        .btn-edit {
            background: #1E3A8A;
            color: white;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .btn-delete {
            background: #DC143C;
            color: white;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }

        .filter-group select,
        .filter-group input {
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
        }

        .news-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }

        .news-table th {
            background: linear-gradient(135deg, #1E3A8A, #0F172A);
            color: white;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
        }

        .news-table td {
            padding: 1rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .news-table tr:hover {
            background: #f9fafb;
        }

        .news-image-thumb {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }

        .category-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
        }

        .badge-politics {
            background: #DC143C;
        }

        .badge-society {
            background: #10B981;
        }

        .badge-business {
            background: #F59E0B;
        }

        .badge-sports {
            background: #3B82F6;
        }

        .badge-technology {
            background: #8B5CF6;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .pagination button {
            padding: 0.5rem 1rem;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination button:hover:not(:disabled) {
            background: #1E3A8A;
            color: white;
            border-color: #1E3A8A;
        }

        .pagination button.active {
            background: #1E3A8A;
            color: white;
            border-color: #1E3A8A;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            color: #1E3A8A;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6b7280;
        }

        .modal-body {
            margin-bottom: 1.5rem;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-newspaper"></i> Manage News</h1>
            <a href="dashboard.html" class="btn btn-primary">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label for="categoryFilter">Category</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="politics">Politics</option>
                    <option value="society">Society</option>
                    <option value="business">Business</option>
                    <option value="sports">Sports</option>
                    <option value="technology">Technology</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="searchInput">Search</label>
                <input type="text" id="searchInput" placeholder="Search by title...">
            </div>
        </div>

        <!-- News Table -->
        <div id="newsTableContainer">
            <div class="loading">
                <i class="fas fa-spinner fa-spin fa-3x"></i>
                <p>Loading news...</p>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Confirm Delete</h2>
                <button class="modal-close" onclick="closeDeleteModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this news article?</p>
                <p style="color: #DC143C; font-weight: 600; margin-top: 1rem;">This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeDeleteModal()"
                    style="background: #6b7280; color: white;">Cancel</button>
                <button class="btn btn-danger" onclick="confirmDelete()">
                    <i class="fas fa-trash"></i> Delete
                </button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script>
        let allNews = [];
        let filteredNews = [];
        let currentPage = 1;
        const itemsPerPage = 10;
        let deleteNewsId = null;
        const token = localStorage.getItem('adminToken');

        // Check authentication
        if (!token) {
            window.location.href = 'login.html';
        }

        // Category translations
        const categoryNames = {
            politics: 'Politics / राजनीति',
            society: 'Society / समाज',
            business: 'Business / व्यापार',
            sports: 'Sports / खेलकुद',
            technology: 'Technology / प्रविधि'
        };

        // Load all news
        async function loadNews() {
            try {
                const response = await fetch(`${window.API_URL}/news`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load news');

                const data = await response.json();
                allNews = data.news || data;
                filteredNews = [...allNews];
                renderTable();
            } catch (error) {
                console.error('Error loading news:', error);
                document.getElementById('newsTableContainer').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Failed to load news. Please try again.</p>
                    </div>
                `;
            }
        }

        // Filter news
        function filterNews() {
            const category = document.getElementById('categoryFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            filteredNews = allNews.filter(news => {
                const matchesCategory = !category || news.category === category;
                const matchesSearch = !search ||
                    news.title.ne.toLowerCase().includes(search) ||
                    news.title.en.toLowerCase().includes(search);
                return matchesCategory && matchesSearch;
            });

            currentPage = 1;
            renderTable();
        }

        // Render table
        function renderTable() {
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageNews = filteredNews.slice(start, end);

            if (pageNews.length === 0) {
                document.getElementById('newsTableContainer').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>No news found.</p>
                    </div>
                `;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const tableHTML = `
                <table class="news-table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Views</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${pageNews.map(news => {
                const image = news.images && news.images.length > 0 ? news.images[0] : news.image;
                const date = new Date(news.createdAt).toLocaleDateString();
                return `
                                <tr>
                                    <td><img src="${image}" class="news-image-thumb" alt="News"></td>
                                    <td>
                                        <strong>${news.title.en}</strong><br>
                                        <small style="color: #6b7280;">${news.title.ne}</small>
                                    </td>
                                    <td><span class="category-badge badge-${news.category}">${categoryNames[news.category]}</span></td>
                                    <td>${date}</td>
                                    <td>${news.views || 0}</td>
                                    <td>
                                        <div class="actions">
                                            <a href="../article.html?id=${news._id}" target="_blank" class="btn btn-edit" title="View">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <button class="btn btn-delete" onclick="openDeleteModal('${news._id}')" title="Delete">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `;
            }).join('')}
                    </tbody>
                </table>
            `;

            document.getElementById('newsTableContainer').innerHTML = tableHTML;
            renderPagination();
        }

        // Render pagination
        function renderPagination() {
            const totalPages = Math.ceil(filteredNews.length / itemsPerPage);

            if (totalPages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            let paginationHTML = '';

            // Previous button
            paginationHTML += `<button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                <i class="fas fa-chevron-left"></i>
            </button>`;

            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    paginationHTML += `<button onclick="changePage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    paginationHTML += `<button disabled>...</button>`;
                }
            }

            // Next button
            paginationHTML += `<button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                <i class="fas fa-chevron-right"></i>
            </button>`;

            document.getElementById('pagination').innerHTML = paginationHTML;
        }

        // Change page
        function changePage(page) {
            const totalPages = Math.ceil(filteredNews.length / itemsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
        }

        // Delete modal functions
        function openDeleteModal(newsId) {
            deleteNewsId = newsId;
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            deleteNewsId = null;
            document.getElementById('deleteModal').classList.remove('active');
        }

        async function confirmDelete() {
            if (!deleteNewsId) return;

            try {
                const response = await fetch(`${window.API_URL}/news/${deleteNewsId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Failed to delete news');

                alert('News deleted successfully!');
                closeDeleteModal();
                loadNews(); // Reload news list
            } catch (error) {
                console.error('Error deleting news:', error);
                alert('Failed to delete news. Please try again.');
            }
        }

        // Event listeners
        document.getElementById('categoryFilter').addEventListener('change', filterNews);
        document.getElementById('searchInput').addEventListener('input', filterNews);

        // Close modal on outside click
        document.getElementById('deleteModal').addEventListener('click', (e) => {
            if (e.target.id === 'deleteModal') closeDeleteModal();
        });

        // Initialize
        loadNews();
    </script>
</body>

</html>
